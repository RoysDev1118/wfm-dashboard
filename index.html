<!DOCTYPE html>
<html lang="ru">
<head>
<link rel="apple-touch-icon" href="icon.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Панель оператора: Статусы сотрудников</title>
    
    <!-- Подключение PWA Манифеста -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Метатеги для iOS (убирают браузерную строку Apple Safari) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="WFM Опс">
    <link rel="apple-touch-icon" href="https://flaticon.com">

    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 800px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        .header-block { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #f4f7f6; padding-bottom: 15px; }
        h2 { margin: 0; color: #1c1c1e; font-size: 22px; }
        
        .refresh-btn { padding: 10px 20px; background-color: #007aff; border: none; border-radius: 8px; color: white; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; -webkit-tap-highlight-color: transparent; }
        .refresh-btn:hover { background-color: #0056b3; }
        
        .loader { text-align: center; color: #8e8e93; font-size: 16px; padding: 40px 0; }
        .error { color: #ff3b30; background: #ffe5e5; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 14px; display: none; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; text-align: left; }
        th { color: #8e8e93; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; padding: 12px 10px; border-bottom: 2px solid #e5e5ea; }
        td { padding: 14px 10px; border-bottom: 1px solid #e5e5ea; font-size: 15px; color: #1c1c1e; vertical-align: middle; }
        tr:hover { background-color: #f8f9fa; }
        
        /* Статусы */
        .status-badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; text-align: center; }
        .status-working { background-color: #e6f4ea; color: #248a3d; }
        .status-resting { background-color: #f2f2f7; color: #8e8e93; }
        
        /* Предупреждения для защитного алгоритма */
        .warning-row { background-color: #fff9f0; }
        .warning-row:hover { background-color: #fff3cd; }
        .warning-badge { display: inline-block; background-color: #fff3cd; color: #b7791f; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; margin-top: 4px; border: 1px solid #fbd38d; }
        
        .time-text { font-family: monospace; font-size: 14px; font-weight: 600; color: #3a3a3c; }
        .time-none { color: #aeaeae; font-style: italic; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-block">
        <h2>👥 Мониторинг сотрудников WFM</h2>
        <button class="refresh-btn" onclick="loadDashboardData()">🔄 Обновить данные</button>
    </div>

    <div id="errorBlock" class="error"></div>
    <div id="loaderBlock" class="loader">Загрузка актуальных статусов из СПБ...</div>

    <table id="operatorsTable" style="display: none;">
        <thead>
            <tr>
                <th>Сотрудник</th>
                <th>Текущий статус</th>
                <th>Чекин за сегодня</th>
            </tr>
        </thead>
        <tbody id="operatorsList">
            <!-- Сюда будут рендериться строки -->
        </tbody>
    </table>
</div>

<script>
    const SUPABASE_URL = "https://qxpnzaokqdctnfiqrrvx.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4cG56YW9rcWRjdG5maXFycnZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MzA1OTAsImV4cCI6MjEwNjAwNjU5MH0.F8Or6x0QaghtTd4I_CZZA1LkXkgGYrbDraDmudQCEAc";

    window.addEventListener('DOMContentLoaded', () => {
        loadDashboardData();
    });

    async function loadDashboardData() {
        const loader = document.getElementById('loaderBlock');
        const table = document.getElementById('operatorsTable');
        const listContainer = document.getElementById('operatorsList');
        const errorBlock = document.getElementById('errorBlock');

        loader.style.display = 'block';
        table.style.display = 'none';
        errorBlock.style.display = 'none';
        listContainer.innerHTML = '';

        try {
            const todayStr = new Date().toISOString().split('T')[0];

            const [pickersResponse, shiftsResponse] = await Promise.all([
                fetch(`${SUPABASE_URL}/rest/v1/allowed_pickers?is_active=eq.true`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                }),
                fetch(`${SUPABASE_URL}/rest/v1/time_pickers?date_work=eq.${todayStr}`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                })
            ]);

            if (!pickersResponse.ok) throw new Error(`Ошибка allowed_pickers: ${pickersResponse.status}`);
            if (!shiftsResponse.ok) throw new Error(`Ошибка time_pickers: ${shiftsResponse.status}`);

            const allPickers = await pickersResponse.json();
            const todayShifts = await shiftsResponse.json();

            const shiftsMap = {};
            todayShifts.forEach(shift => {
                shiftsMap[shift.picker_name] = shift;
            });

            const preparedData = allPickers.map(picker => {
                const name = picker.name;
                const dbStatus = picker.status || "отдыхаю";
                const todayShift = shiftsMap[name];
                
                let typeWeight = 3; 
                let timeForSort = '99:99:99';

                if (dbStatus === "работаю" && !todayShift) {
                    typeWeight = 1; 
                } else if (dbStatus === "работаю" && todayShift) {
                    typeWeight = 2; 
                    timeForSort = todayShift.time_start || '23:59:59';
                }

                return { picker, todayShift, dbStatus, typeWeight, timeForSort };
            });

            preparedData.sort((a, b) => {
                if (a.typeWeight !== b.typeWeight) {
                    return a.typeWeight - b.typeWeight;
                }
                return a.timeForSort.localeCompare(b.timeForSort);
            });

            preparedData.forEach(({ picker, todayShift, dbStatus }) => {
                const name = picker.name;
                let statusHtml = '';
                let timeHtml = '';
                let rowClass = '';

                if (dbStatus === "работаю" && !todayShift) {
                    rowClass = 'class="warning-row"';
                    statusHtml = `
                        <span class="status-badge status-working">В работе</span>
                        <br><span class="warning-badge">⚠️ Смена с прошлого дня!</span>
                    `;
                    timeHtml = '<span class="time-none">Нет чекина сегодня</span>';
                } 
                else if (dbStatus === "работаю" && todayShift) {
                    statusHtml = '<span class="status-badge status-working">В работе</span>';
                    timeHtml = `<span class="time-text">${formatTime(todayShift.time_start)}</span>`;
                } 
                else {
                    statusHtml = '<span class="status-badge status-resting">Отдыхает</span>';
                    if (todayShift && todayShift.time_start) {
                        // Формируем строчку с временем чекаута, если оно передано из Supabase
                        const checkoutTime = todayShift.time_end ? ` до ${formatTime(todayShift.time_end)}` : '';
                        timeHtml = `<span class="time-none">Работал с ${formatTime(todayShift.time_start)}${checkoutTime}</span>`;
                    } else {
                        timeHtml = '<span class="time-none">—</span>';
                    }
                }

                listContainer.innerHTML += `
                    <tr ${rowClass}>
                        <td style="font-weight: 600; color: #1c1c1e;">${escapeHtml(name)}</td>
                        <td>${statusHtml}</td>
                        <td>${timeHtml}</td>
                    </tr>
                `;
            });

            loader.style.display = 'none';
            table.style.display = 'table';

        } catch (err) {
            console.error("Ошибка панели оператора:", err);
            loader.style.display = 'none';
            errorBlock.innerText = `Критическая ошибка загрузки: ${err.message}`;
            errorBlock.style.display = 'block';
        }
    }

    function formatTime(timeStr) {
        if (!timeStr) return '—';
        const parts = timeStr.split(':');
        if (parts.length >= 2) {
            return `${parts[0]}:${parts[1]}`;
        }
        return timeStr;
    }

    function escapeHtml(string) {
        return String(string).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
</script>
<script>
  let deferredPrompt;

  // 1. Регистрация Сервис-Воркера
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => console.log('Service Worker зарегистрирован', reg.scope))
        .catch((err) => console.error('Ошибка SW:', err));
    });
  }

  // 2. Ловим событие готовности к установке PWA
  window.addEventListener('beforeinstallprompt', (e) => {
    // Не даем браузеру показать стандартную мини-плашку снизу
    e.preventDefault();
    // Сохраняем событие, чтобы вызвать его по клику на кнопку
    deferredPrompt = e;
    
    // Находим вашу синюю кнопку обновления данных
    const refreshBtn = document.querySelector('.refresh-btn');
    if (refreshBtn) {
      // Меняем текст кнопки, чтобы пользователь знал, что можно установить приложение
      refreshBtn.innerHTML = '✨ Установить приложение';
      
      // Меняем логику кнопки: теперь первый клик будет вызывать установку
      refreshBtn.addEventListener('click', installAppWorkflow);
    }
  });

  async function installAppWorkflow(e) {
    if (!deferredPrompt) return;
    
    // Показываем системное окно установки
    deferredPrompt.prompt();
    
    // Ждем выбора пользователя
    const { outcome } = await deferredPrompt.userChoice;
    console.log(`Пользователь выбрал: ${outcome}`);
    
    // Очищаем переменную, так как prompt() можно вызвать только один раз
    deferredPrompt = null; 
    
    // Возвращаем кнопке её исходный вид и перезагружаем страницу
    const refreshBtn = document.querySelector('.refresh-btn');
    if (refreshBtn) {
      refreshBtn.innerHTML = '🔄 Обновить данные';
      // Удаляем этот обработчик, чтобы кнопка снова работала как обычное обновление
      refreshBtn.removeEventListener('click', installAppWorkflow);
    }
    window.location.reload();
  }
</script>
</body>
</html>
